<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Valheim Portal</title>
    <style>
        body {
            background-color: #0b0e11;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            gap: 20px;
        }
        
        #portal-img {
            width: 250px;
            height: auto;
            cursor: pointer;
        }
        
        p {
            color: #e5e7eb;
            font-family: monospace;
            font-size: 1.2rem;
            padding: 8px;
            text-align: center;
        }
        
        input {
            background: #171311;
            border: 1px solid #4a3b32;
            border-bottom: 2px solid #8b6d51;
            color: #e5e7eb;
            font-family: monospace;
            font-size: 1.2rem;
            padding: 8px;
            text-align: center;
            width: 40px;
            outline: none;
        }
        
        span {
            font-family: 'Courier New', Courier, monospace;
            font-size: large;
            font-style: italic;
            color: white;
        }
        
        input:focus {
            border-bottom-color: #00f0ff;
        }
    </style>
</head>

<body>

    <p>I zarządałem od owego władcy, coby stosikiem żelaza mi za łeb ów zapłacił.
        <br>Zaś on odrzekł:
        <br>- Cena, której rządasz, jest niemała. Wszak mieć stosik, i go nie mieć, to razem <input type="text" id="amount" onkeydown="if(event.key==='Enter') check()"></input> sztabek.
    </p>
    <span>Podpowiedź: Hrabia namiętnie czytał pewną sagę. Zdaje się że 318 strona 4 tomu mogła być inspiracją.</span>

    <script>
        function check() {
            if (document.getElementById('amount').value.trim() === '60') {
                window.location.href = './move_forward.html';
            }
        }
    </script>
</body>

</html>
